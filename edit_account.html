 <header>

  <section class="edit_profile_box">
      <div class="profile_box">
        <h1 class="profile_title">EDIT YOUR PROFILE</h1>
        <form class="profile-form"> <!--Rever Form!!!!-->
          <div class="form_group">
            <label class="form_label">USERNAME</label>
            <input
              type="text"
              id="username"
              class="form-input"
              value="EGGSLAYER3000"
            />
          </div>
          <div class="form_group">
            <p class="form_label">CHOOSE NEW AVATAR</p>
            <div class="avatar_grid">
              <button type="button" class="avatar_option selected">🍳</button>
              <button type="button" class="avatar_option">🥘</button>
              <button type="button" class="avatar_option">🥚</button>
              <button type="button" class="avatar_option">🦢</button>
              <button type="button" class="avatar_option">🐣</button>
              <button type="button" class="avatar_option">🍄</button>
              <button type="button" class="avatar_option">🇲🇽</button>
              <button type="button" class="avatar_option">🥷</button>
              <button type="button" class="avatar_option">👵</button>
              <button type="button" class="avatar_option">🦤</button>
              <button type="button" class="avatar_option">🪩</button>
            </div>
          </div>
          <div class="button_row">
            <button type="submit" class="btn btn_save">✓ SAVE CHANGES</button>
            <button type="button" class="btn btn_cancel">✕ CANCEL</button>
          </div>
        </form>
      </div>
    </section>


  <div class="stats_box">
      <h3 class="title">YOUR STATS</h3>
      <div class="stats-grid">
        <div class="tile">
          <div>
            <div class="label">World Rank</div>
            <div class="value">#847</div>
          </div>
        </div>
        <div class="tile">
          <div>
            <div class="label">High Score</div>
            <div class="value">12,450</div>
          </div>
        </div>
        <div class="tile">
          <div>
            <div class="label">Games Played</div>
            <div class="value">234</div>
          </div>
        </div>
        <div class="tile">
          <div>
            <div class="label">Time Played</div>
            <div class="value">12h 34m</div>
          </div>
        </div>
      </div>
  </div>
